<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balls</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f7f4ef; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }

  #cursor {
    position: fixed;
    width: 14px; height: 14px;
    border: 2px solid #1a1a2e;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s, border-color 0.15s, background 0.15s;
    z-index: 9999;
    mix-blend-mode: multiply;
  }

  .ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    border: 2px solid rgba(230,57,70,0.5);
    transform: translate(-50%,-50%) scale(0);
    animation: rpl 0.6s ease-out forwards;
    z-index: 9998;
  }
  @keyframes rpl { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
</style>
</head>
<body>
<div id="cursor"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const cur = document.getElementById('cursor');

let W, H, cx, cy; // cx,cy = screen center (gravity point)
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

/* ── palette ── */
const PAL = [
  '#e63946','#457b9d','#f4a261','#2a9d8f',
  '#e9c46a','#9b5de5','#e76f51','#4cc9f0',
  '#c77dff','#f72585','#06d6a0','#118ab2',
];

/* ── mouse ── */
let mx = -9999, my = -9999;   // raw mouse (off-screen default = no repulsion)
let smx = -9999, smy = -9999; // smoothed
let pressing = false;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cur.style.left = mx + 'px';
  cur.style.top  = my + 'px';
});
document.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

function boom(x, y) {
  balls.forEach(b => {
    const dx = b.x - x, dy = b.y - y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < 200 && d > 0) {
      const f = ((200 - d) / 200) * 8;
      b.vx += (dx/d) * f;
      b.vy += (dy/d) * f;
    }
  });
}

function ripple(x, y) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.cssText = `left:${x}px;top:${y}px;width:160px;height:160px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

document.addEventListener('mousedown', e => {
  pressing = true;
  cur.style.width = '26px'; cur.style.height = '26px';
  cur.style.background = 'rgba(230,57,70,0.15)';
  ripple(e.clientX, e.clientY);
  boom(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => {
  pressing = false;
  cur.style.width = '14px'; cur.style.height = '14px';
  cur.style.background = 'transparent';
});

/* touch */
document.addEventListener('touchmove', e => {
  e.preventDefault();
  mx = e.touches[0].clientX; my = e.touches[0].clientY;
}, { passive: false });
document.addEventListener('touchstart', e => {
  mx = e.touches[0].clientX; my = e.touches[0].clientY;
  boom(mx, my);
});
document.addEventListener('touchend', () => { mx = -9999; my = -9999; });

/* ── Ball ── */
class Ball {
  constructor() {
    // start near center with a small random offset
    const angle = Math.random() * Math.PI * 2;
    const dist  = Math.random() * 60;
    this.x  = cx + Math.cos(angle) * dist;
    this.y  = cy + Math.sin(angle) * dist;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.r  = Math.random() * 14 + 5;
    this.color = PAL[Math.floor(Math.random() * PAL.length)];
    this.baseAlpha = Math.random() * 0.35 + 0.35;
    this.alpha = this.baseAlpha;
    this.wobble = Math.random() * Math.PI * 2;
    // each ball has a tiny natural drift angle so the cluster breathes
    this.driftA = Math.random() * Math.PI * 2;
    this.driftS = 0.003 + Math.random() * 0.004;
  }

  update() {
    /* 1. gravity toward center */
    const toCx = cx - this.x;
    const toCy = cy - this.y;
    const distC = Math.sqrt(toCx*toCx + toCy*toCy);

    // stronger gravity the farther away — keeps cluster tight
    const gStrength = 0.018 + Math.min(distC, 300) * 0.00012;
    this.vx += (toCx / distC) * gStrength * distC * 0.015;
    this.vy += (toCy / distC) * gStrength * distC * 0.015;

    /* 2. soft collision / repulsion with other balls (done in loop below) */

    /* 3. mouse repulsion */
    const REPEL = pressing ? 180 : 130;
    const FMUL  = pressing ? 2.2 : 1.2;
    const dxm = this.x - smx, dym = this.y - smy;
    const dm  = Math.sqrt(dxm*dxm + dym*dym);
    if (dm < REPEL && dm > 0) {
      const force = (REPEL - dm) / REPEL;
      this.vx += (dxm/dm) * force * FMUL;
      this.vy += (dym/dm) * force * FMUL;
      this.alpha = Math.min(0.98, this.baseAlpha + force * 0.45);
    } else {
      this.alpha += (this.baseAlpha - this.alpha) * 0.07;
    }

    /* 4. gentle organic drift */
    this.driftA += this.driftS;
    this.vx += Math.cos(this.driftA) * 0.015;
    this.vy += Math.sin(this.driftA) * 0.015;

    /* 5. damping */
    this.vx *= 0.978;
    this.vy *= 0.978;

    /* 6. speed cap */
    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    const MAX = pressing ? 10 : 5;
    if (spd > MAX) { this.vx = this.vx/spd*MAX; this.vy = this.vy/spd*MAX; }

    this.x += this.vx;
    this.y += this.vy;
    this.wobble += 0.02;
  }

  draw() {
    const pr = this.r + Math.sin(this.wobble) * 0.6;
    ctx.save();
    ctx.globalAlpha = this.alpha;

    // radial gradient for soft glow
    const g = ctx.createRadialGradient(
      this.x - pr*0.28, this.y - pr*0.28, pr*0.04,
      this.x, this.y, pr
    );
    g.addColorStop(0, lighten(this.color, 0.6));
    g.addColorStop(1, this.color);

    ctx.beginPath();
    ctx.arc(this.x, this.y, pr, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }
}

function lighten(hex, t) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${r+~~((255-r)*t)},${g+~~((255-g)*t)},${b+~~((255-b)*t)})`;
}

/* ── init ── */
const N = 80;
const balls = Array.from({length: N}, () => new Ball());

/* ── ball-ball soft repulsion ── */
function applyCollisions() {
  for (let i = 0; i < balls.length; i++) {
    for (let j = i+1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      const minD = a.r + b.r + 1;
      if (d < minD && d > 0) {
        // push apart so they no longer overlap
        const push = (minD - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x += nx * push;
        a.y += ny * push;
        b.x -= nx * push;
        b.y -= ny * push;
        // reflect velocities along collision normal
        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
        const dot = dvx * nx + dvy * ny;
        if (dot < 0) {
          const restitution = 0.55;
          a.vx -= (1 + restitution) * 0.5 * dot * nx;
          a.vy -= (1 + restitution) * 0.5 * dot * ny;
          b.vx += (1 + restitution) * 0.5 * dot * nx;
          b.vy += (1 + restitution) * 0.5 * dot * ny;
        }
      }
    }
  }
}

/* ── dot grid ── */
function drawGrid() {
  ctx.save();
  ctx.globalAlpha = 0.045;
  ctx.fillStyle = '#1a1a2e';
  for (let gx = 40; gx < W; gx += 40)
    for (let gy = 40; gy < H; gy += 40) {
      ctx.beginPath();
      ctx.arc(gx, gy, 1.1, 0, Math.PI*2);
      ctx.fill();
    }
  ctx.restore();
}

/* ── loop ── */
function loop() {
  smx += (mx - smx) * 0.12;
  smy += (my - smy) * 0.12;

  ctx.clearRect(0, 0, W, H);
  drawGrid();
  applyCollisions();
  balls.forEach(b => { b.update(); b.draw(); });
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
