<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gravity-balls · breathe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    background: #1a1a2e;
    font-family: 'Inter', sans-serif;
    transition: background 2s ease;
  }

  canvas { display: block; width: 100%; height: 100%; cursor: none; position: fixed; inset: 0; }

  /* custom cursor — soft circle */
  #cursor {
    position: fixed;
    width: 40px; height: 40px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.04);
    transition: width 0.4s ease, height 0.4s ease, background 0.4s ease, border-color 0.4s;
    backdrop-filter: blur(2px);
  }
  #cursor.pressing {
    width: 70px; height: 70px;
    background: rgba(255,255,255,0.08);
  }

  /* breathe ring — ambient pulse in center */
  #breathe {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 1;
    border: 1px solid rgba(255,255,255,0.06);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { width: 80px; height: 80px; opacity: 0.4; }
    50%      { width: 160px; height: 160px; opacity: 0.1; }
  }

  /* top message */
  #message {
    position: fixed;
    top: 32px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    z-index: 9999;
    pointer-events: none;
    transition: opacity 1s;
    white-space: nowrap;
  }

  /* mood selector */
  #moods {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px;
    z-index: 9999;
  }

  .mood-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.45);
    font-family: 'Inter', sans-serif;
    font-size: 0.68rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    padding: 6px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, border-color 0.3s, transform 0.2s;
    backdrop-filter: blur(10px);
  }
  .mood-btn:hover { transform: translateY(-2px); }
  .mood-btn.active {
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.9);
  }

  /* ripple */
  .ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.25);
    transform: translate(-50%,-50%) scale(0);
    animation: rpl 1.2s ease-out forwards;
    z-index: 9998;
  }
  @keyframes rpl { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }

  /* hint */
  #hint {
    position: fixed;
    bottom: 72px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.18);
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="breathe"></div>
<div id="message">touch to release · breathe</div>
<canvas id="c"></canvas>

<div id="hint">hover gently · click to scatter · choose your mood below</div>
<div id="moods">
  <button class="mood-btn active" data-mood="calm">🌊 calm</button>
  <button class="mood-btn" data-mood="joy">🌸 joy</button>
  <button class="mood-btn" data-mood="focus">🌙 focus</button>
  <button class="mood-btn" data-mood="energy">🔥 energy</button>
</div>

<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const curEl   = document.getElementById('cursor');
const breatheEl = document.getElementById('breathe');
const msgEl   = document.getElementById('message');

let W, H, gx, gy;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  gx = W / 2; gy = H / 2;
  breatheEl.style.left = gx + 'px';
  breatheEl.style.top  = gy + 'px';
}
resize();
window.addEventListener('resize', resize);

/* ── MOODS ── */
const MOODS = {
  calm: {
    bg: '#0f1923',
    palette: [
      [168,218,220],[72,167,181],[34,116,165],
      [155,186,226],[107,152,198],[200,225,235],
      [130,180,210],[90,140,180],
    ],
    gravity: 0.013,
    damping: 0.985,
    drift: 0.008,
    repel: 110,
    maxSpeed: 4,
    breatheColor: '120,200,220',
    message: 'breathe slowly · you are safe',
  },
  joy: {
    bg: '#1a0f1e',
    palette: [
      [255,179,186],[255,223,186],[255,255,186],
      [186,255,201],[186,225,255],[255,186,255],
      [255,210,130],[210,255,190],
    ],
    gravity: 0.016,
    damping: 0.980,
    drift: 0.012,
    repel: 120,
    maxSpeed: 5,
    breatheColor: '255,200,220',
    message: 'you are full of light ✦',
  },
  focus: {
    bg: '#0a0a12',
    palette: [
      [100,100,160],[80,80,140],[120,100,180],
      [60,80,130],[140,120,200],[90,110,160],
      [70,90,150],[110,90,170],
    ],
    gravity: 0.020,
    damping: 0.990,
    drift: 0.005,
    repel: 90,
    maxSpeed: 3,
    breatheColor: '100,100,200',
    message: 'clear mind · one breath at a time',
  },
  energy: {
    bg: '#12080a',
    palette: [
      [255,100,80],[255,160,60],[255,80,120],
      [255,200,80],[220,80,200],[255,120,60],
      [200,60,255],[255,80,80],
    ],
    gravity: 0.022,
    damping: 0.972,
    drift: 0.018,
    repel: 150,
    maxSpeed: 8,
    breatheColor: '255,120,80',
    message: 'feel the spark · you\'ve got this ⚡',
  },
};

let mood = MOODS.calm;
let currentMoodKey = 'calm';

function setMood(key) {
  currentMoodKey = key;
  mood = MOODS[key];
  document.body.style.background = mood.bg;
  msgEl.textContent = mood.message;
  breatheEl.style.borderColor = `rgba(${mood.breatheColor},0.15)`;
  // recolor balls gradually
  balls.forEach(b => {
    b.targetColor = mood.palette[Math.floor(Math.random() * mood.palette.length)];
  });
  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mood === key);
  });
}

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => setMood(btn.dataset.mood));
});

/* ── helpers ── */
function lerpColor(a, b, t) {
  return [~~(a[0]+(b[0]-a[0])*t), ~~(a[1]+(b[1]-a[1])*t), ~~(a[2]+(b[2]-a[2])*t)];
}
function toRgba([r,g,b], a=1) { return `rgba(${r},${g},${b},${a})`; }
function lightenRgb(rgb, t) { return rgb.map(c => ~~(c+(255-c)*t)); }

/* ── mouse ── */
let mx = -9999, my = -9999, smx = -9999, smy = -9999;
let pressing = false;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  curEl.style.left = mx + 'px';
  curEl.style.top  = my + 'px';
});
document.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

function scatter(x, y) {
  balls.forEach(b => {
    const dx = b.x - x, dy = b.y - y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    if (d < 250) {
      const f = ((250 - d) / 250) * 7 / b.mass;
      b.vx += (dx/d) * f;
      b.vy += (dy/d) * f;
    }
  });
}

function ripple(x, y) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.cssText = `left:${x}px;top:${y}px;width:220px;height:220px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

document.addEventListener('mousedown', e => {
  pressing = true;
  curEl.classList.add('pressing');
  ripple(e.clientX, e.clientY);
  scatter(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => {
  pressing = false;
  curEl.classList.remove('pressing');
});

/* touch */
document.addEventListener('touchmove', e => {
  e.preventDefault();
  mx = e.touches[0].clientX; my = e.touches[0].clientY;
}, { passive: false });
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  mx = t.clientX; my = t.clientY;
  scatter(mx, my); ripple(mx, my);
});
document.addEventListener('touchend', () => { mx = -9999; my = -9999; });

/* ── Ball ── */
class Ball {
  constructor() {
    const angle = Math.random() * Math.PI * 2;
    const dist  = Math.random() * 100;
    this.x = gx + Math.cos(angle) * dist;
    this.y = gy + Math.sin(angle) * dist;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.r  = Math.random() * 18 + 7;
    this.mass = (this.r / 10) ** 1.5;
    this.color = [...mood.palette[Math.floor(Math.random() * mood.palette.length)]];
    this.targetColor = [...this.color];
    this.alpha = 0;  // fade in
    this.targetAlpha = Math.random() * 0.25 + 0.55;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.012 + Math.random() * 0.01;
    this.driftA = Math.random() * Math.PI * 2;
    this.driftS = 0.002 + Math.random() * 0.003;
    this.pulsePhase = Math.random() * Math.PI * 2;
  }

  update() {
    /* smoothly shift color toward target */
    this.color = lerpColor(this.color, this.targetColor, 0.015);

    /* fade in */
    this.alpha += (this.targetAlpha - this.alpha) * 0.04;

    /* gravity toward center */
    const dx = gx - this.x, dy = gy - this.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    const gs = mood.gravity / this.mass;
    this.vx += (dx/d) * gs * d * 0.015;
    this.vy += (dy/d) * gs * d * 0.015;

    /* mouse repulsion — very soft */
    const REPEL = pressing ? mood.repel * 1.6 : mood.repel;
    const FMUL  = pressing ? 2.0 : 0.9;
    const dxm = this.x - smx, dym = this.y - smy;
    const dm  = Math.sqrt(dxm*dxm + dym*dym) || 1;
    if (dm < REPEL) {
      const force = (REPEL - dm) / REPEL;
      // ease-in so balls glide away gently, not snap
      const eased = force * force;
      this.vx += (dxm/dm) * eased * FMUL / this.mass;
      this.vy += (dym/dm) * eased * FMUL / this.mass;
    }

    /* gentle organic drift — makes cluster feel alive */
    this.driftA += this.driftS;
    this.vx += Math.cos(this.driftA) * mood.drift;
    this.vy += Math.sin(this.driftA) * mood.drift;

    /* damping */
    this.vx *= mood.damping;
    this.vy *= mood.damping;

    /* speed cap */
    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    const cap = (pressing ? mood.maxSpeed * 1.6 : mood.maxSpeed) / this.mass;
    if (spd > cap) { this.vx = this.vx/spd*cap; this.vy = this.vy/spd*cap; }

    this.x += this.vx;
    this.y += this.vy;
    this.wobble += this.wobbleSpeed;
    this.pulsePhase += 0.018;
    this.speed = spd;
  }

  draw() {
    /* soft size pulse — like breathing */
    const pulse = this.r + Math.sin(this.pulsePhase) * (this.r * 0.08);

    ctx.save();
    ctx.globalAlpha = this.alpha;

    /* outer soft glow */
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, pulse * 2.2);
    glow.addColorStop(0,   toRgba(this.color, 0.18));
    glow.addColorStop(0.5, toRgba(this.color, 0.06));
    glow.addColorStop(1,   toRgba(this.color, 0));
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulse * 2.2, 0, Math.PI*2);
    ctx.fillStyle = glow;
    ctx.fill();

    /* ball body */
    const grad = ctx.createRadialGradient(
      this.x - pulse*0.32, this.y - pulse*0.32, pulse*0.05,
      this.x, this.y, pulse
    );
    grad.addColorStop(0, toRgba(lightenRgb(this.color, 0.7)));
    grad.addColorStop(0.6, toRgba(this.color, 0.95));
    grad.addColorStop(1, toRgba(this.color, 0.6));
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulse, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }
}

/* ── init ── */
const N = 75;
const balls = Array.from({length: N}, () => new Ball());

/* ── collision (no overlap) ── */
function applyCollisions() {
  for (let i = 0; i < balls.length; i++) {
    for (let j = i+1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = a.x-b.x, dy = a.y-b.y;
      const d  = Math.sqrt(dx*dx+dy*dy) || 0.001;
      const minD = a.r + b.r + 1.5;
      if (d < minD) {
        const push = (minD-d)/2;
        const nx = dx/d, ny = dy/d;
        a.x += nx*push; a.y += ny*push;
        b.x -= nx*push; b.y -= ny*push;
        const dvx = a.vx-b.vx, dvy = a.vy-b.vy;
        const dot = dvx*nx + dvy*ny;
        if (dot < 0) {
          const res = 0.3; // low restitution = soft bounce, not elastic
          const mt = a.mass + b.mass;
          const imp = (1+res)*dot/mt;
          a.vx -= imp*b.mass*nx; a.vy -= imp*b.mass*ny;
          b.vx += imp*a.mass*nx; b.vy += imp*a.mass*ny;
        }
      }
    }
  }
}

/* ── ambient particles — tiny floating dots ── */
const PARTICLES = Array.from({length: 40}, () => ({
  x: Math.random()*1920, y: Math.random()*1080,
  r: Math.random()*1.5+0.3,
  vy: -(Math.random()*0.3+0.05),
  vx: (Math.random()-0.5)*0.15,
  alpha: Math.random()*0.25+0.05,
}));

function updateParticles() {
  PARTICLES.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -5) { p.y = H+5; p.x = Math.random()*W; }
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
  });
}

function drawParticles() {
  ctx.save();
  ctx.fillStyle = `rgba(${mood.breatheColor},1)`;
  PARTICLES.forEach(p => {
    ctx.globalAlpha = p.alpha * 0.6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

/* ── ambient background gradient — shifts slowly ── */
let bgPhase = 0;
function drawBackground() {
  bgPhase += 0.003;
  const [r1,g1,b1] = mood.palette[0] || [30,30,60];
  const [r2,g2,b2] = mood.palette[3] || [10,20,50];

  const bg = ctx.createRadialGradient(
    gx + Math.cos(bgPhase)*W*0.15, gy + Math.sin(bgPhase)*H*0.15, 0,
    gx, gy, Math.max(W,H)*0.9
  );

  // parse bg hex
  const hex = mood.bg.replace('#','');
  const br = parseInt(hex.slice(0,2),16);
  const bg2 = parseInt(hex.slice(2,4),16);
  const bb = parseInt(hex.slice(4,6),16);

  bg.addColorStop(0,   `rgba(${r1},${g1},${b1},0.18)`);
  bg.addColorStop(0.5, `rgba(${r2},${g2},${b2},0.08)`);
  bg.addColorStop(1,   `rgba(${br},${bg2},${bb},0)`);

  ctx.fillStyle = `rgb(${br},${bg2},${bb})`;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

/* ── loop ── */
function loop() {
  smx += (mx - smx) * 0.08; // slower smoothing = gentler feel
  smy += (my - smy) * 0.08;

  drawBackground();
  updateParticles();
  drawParticles();
  applyCollisions();
  balls.forEach(b => { b.update(); b.draw(); });
  requestAnimationFrame(loop);
}

// init mood visuals
setMood('calm');
loop();
</script>
</body>
</html>
