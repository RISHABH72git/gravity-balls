<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gravity-balls v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; }
  canvas{ display:block; width:100%; height:100%; position:fixed; inset:0; z-index:0; }

  /* cursor */
  #cursor{
    position:fixed; width:36px; height:36px; border-radius:50%;
    pointer-events:none; transform:translate(-50%,-50%); z-index:9999;
    border:1.5px solid rgba(255,255,255,.3); background:rgba(255,255,255,.04);
    transition:width .3s,height .3s,background .3s,border-color .3s;
    backdrop-filter:blur(2px);
  }
  #cursor.pressing{ width:64px; height:64px; background:rgba(255,255,255,.08); }
  #cursor.dragging{ width:22px; height:22px; background:rgba(255,200,80,.2); border-color:rgba(255,200,80,.7); }
  #cursor.blackhole{ width:50px; height:50px; background:rgba(0,0,0,.5); border-color:rgba(180,80,255,.7); border-width:2px; }

  /* breathe ring */
  #breathe{
    position:fixed; border-radius:50%; pointer-events:none;
    transform:translate(-50%,-50%); z-index:1;
    border:1px solid rgba(255,255,255,.07);
    animation:breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ width:70px; height:70px; opacity:.35; }
    50%{ width:155px; height:155px; opacity:.08; }
  }

  /* DOM ripple for click scatter */
  .ripple{
    position:fixed; border-radius:50%; pointer-events:none;
    border:1px solid rgba(255,255,255,.18);
    transform:translate(-50%,-50%) scale(0);
    animation:rpl 1.2s ease-out forwards; z-index:9998;
  }
  @keyframes rpl{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  /* black hole cursor ring */
  .bh-ring{
    position:fixed; border-radius:50%; pointer-events:none;
    border:1.5px solid rgba(160,60,255,.45);
    transform:translate(-50%,-50%) scale(0);
    animation:bhrpl 0.8s ease-out forwards; z-index:9997;
  }
  @keyframes bhrpl{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  /* top message */
  #message{
    position:fixed; top:26px; left:50%; transform:translateX(-50%);
    font-size:.7rem; font-weight:300; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,.2); z-index:9999; pointer-events:none; white-space:nowrap;
    transition:opacity .8s, color .5s;
  }

  /* hint bar */
  #hint{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:300; pointer-events:none;
  }
  .hint-pill{
    font-size:.58rem; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.18); white-space:nowrap;
  }
  .hint-pill kbd{
    background:rgba(255,255,255,.08); border-radius:3px;
    padding:1px 5px; font-size:.58rem; color:rgba(255,255,255,.35);
    font-family:'Inter',sans-serif;
  }

  /* side panel */
  #panel{
    position:fixed; right:0; top:0; bottom:0; width:272px;
    background:rgba(6,6,14,.82); backdrop-filter:blur(20px);
    border-left:1px solid rgba(255,255,255,.07);
    z-index:400; display:flex; flex-direction:column; overflow-y:auto;
    transform:translateX(0); transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  #panel.hidden{ transform:translateX(100%); }

  #toggle-panel{
    position:fixed; right:14px; top:50%; transform:translateY(-50%);
    z-index:600; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.11); color:rgba(255,255,255,.5);
    width:26px; height:54px; border-radius:13px; cursor:pointer;
    font-size:.65rem; display:flex; align-items:center; justify-content:center;
    transition:background .2s, right .35s cubic-bezier(.4,0,.2,1);
    writing-mode:vertical-rl; letter-spacing:.1em; font-family:'Inter',sans-serif;
  }
  #toggle-panel:hover{ background:rgba(255,255,255,.12); }
  #toggle-panel.open{ right:286px; }

  .panel-section{ padding:16px 16px 0; }
  .panel-section:last-child{ padding-bottom:28px; }

  .section-title{
    font-size:.58rem; font-weight:500; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(255,255,255,.25); margin-bottom:12px; padding-bottom:7px;
    border-bottom:1px solid rgba(255,255,255,.05);
  }

  .preset-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .preset-btn{
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
    color:rgba(255,255,255,.45); font-family:'Inter',sans-serif;
    font-size:.6rem; padding:9px 3px; border-radius:8px; cursor:pointer;
    transition:all .2s; text-align:center; line-height:1.5;
  }
  .preset-btn:hover{ background:rgba(255,255,255,.11); color:rgba(255,255,255,.9); transform:translateY(-1px); }
  .preset-btn.active{ background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.28); color:#fff; }
  .preset-emoji{ display:block; font-size:1.05rem; margin-bottom:2px; }

  .mood-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .mood-btn{
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.4); font-family:'Inter',sans-serif;
    font-size:.63rem; font-weight:300; padding:8px 5px; border-radius:8px;
    cursor:pointer; transition:all .2s; text-align:center;
  }
  .mood-btn:hover{ background:rgba(255,255,255,.1); color:rgba(255,255,255,.85); }
  .mood-btn.active{ background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.26); color:#fff; }

  .slider-row{ margin-bottom:13px; }
  .slider-label{ display:flex; justify-content:space-between; font-size:.68rem; color:rgba(255,255,255,.4); margin-bottom:5px; font-weight:300; }
  .slider-label span{ color:rgba(255,255,255,.78); font-weight:400; }
  input[type=range]{
    width:100%; -webkit-appearance:none; height:2px; border-radius:2px;
    outline:none; cursor:pointer; background:rgba(255,255,255,.1);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#fff; cursor:pointer; box-shadow:0 0 8px rgba(255,255,255,.3);
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.35); }

  /* v4 badge */
  #v4badge{
    position:fixed; top:22px; right:20px; z-index:9999;
    font-size:.6rem; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,.2); pointer-events:none;
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="breathe"></div>
<div id="message">breathe · you are here</div>
<div id="v4badge">v4</div>
<canvas id="c"></canvas>

<div id="hint">
  <span class="hint-pill"><kbd>Click</kbd> scatter</span>
  <span class="hint-pill"><kbd>Right-click</kbd> black hole</span>
  <span class="hint-pill"><kbd>Drag</kbd> slingshot ball</span>
</div>

<button id="toggle-panel" class="open">‹</button>

<div id="panel">
  <div class="panel-section" style="margin-top:55px">
    <div class="section-title">Presets</div>
    <div class="preset-grid">
      <button class="preset-btn" data-preset="solar"><span class="preset-emoji">🪐</span>Solar</button>
      <button class="preset-btn" data-preset="chaos"><span class="preset-emoji">💥</span>Chaos</button>
      <button class="preset-btn active" data-preset="zen"><span class="preset-emoji">🧘</span>Zen</button>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Mood</div>
    <div class="mood-grid">
      <button class="mood-btn active" data-mood="calm">🌊 Calm</button>
      <button class="mood-btn" data-mood="joy">🌸 Joy</button>
      <button class="mood-btn" data-mood="focus">🌙 Focus</button>
      <button class="mood-btn" data-mood="energy">🔥 Energy</button>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Physics</div>
    <div class="slider-row">
      <div class="slider-label">Gravity <span id="val-gravity">0.013</span></div>
      <input type="range" id="sl-gravity" min="0.001" max="0.06" step="0.001" value="0.013">
    </div>
    <div class="slider-row">
      <div class="slider-label">Ball Count <span id="val-count">75</span></div>
      <input type="range" id="sl-count" min="10" max="200" step="1" value="75">
    </div>
    <div class="slider-row">
      <div class="slider-label">Ball Size <span id="val-size">1.0×</span></div>
      <input type="range" id="sl-size" min="0.3" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="slider-row">
      <div class="slider-label">Repulsion <span id="val-repel">110</span></div>
      <input type="range" id="sl-repel" min="30" max="300" step="5" value="110">
    </div>
    <div class="slider-row">
      <div class="slider-label">Damping <span id="val-damp">0.985</span></div>
      <input type="range" id="sl-damp" min="0.90" max="0.999" step="0.001" value="0.985">
    </div>
    <div class="slider-row">
      <div class="slider-label">Speed Limit <span id="val-speed">4</span></div>
      <input type="range" id="sl-speed" min="1" max="20" step="0.5" value="4">
    </div>
  </div>
</div>

<script>
// ── Canvas ──
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const curEl  = document.getElementById('cursor');
const breatheEl = document.getElementById('breathe');
const msgEl  = document.getElementById('message');

let W, H, gx, gy;
function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  gx = W/2; gy = H/2;
  breatheEl.style.left = gx+'px';
  breatheEl.style.top  = gy+'px';
  buildVig();
}
resize();
window.addEventListener('resize', resize);

// ── Params ──
const P = { gravity:.013, repel:110, sizeScale:1.0, damping:.985, maxSpeed:4, drift:.008 };

// ── Moods ──
const MOODS = {
  calm:  { bg:'#0b1520', palette:[[168,218,220],[72,167,181],[34,116,165],[155,186,226],[107,152,198],[200,225,235],[130,180,210],[90,140,180]], breatheColor:'120,200,220', message:'breathe slowly · you are safe' },
  joy:   { bg:'#140d1a', palette:[[255,179,186],[255,223,186],[255,255,186],[186,255,201],[186,225,255],[255,186,255],[255,210,130],[210,255,190]], breatheColor:'255,200,220', message:'you are full of light ✦' },
  focus: { bg:'#080810', palette:[[100,100,160],[80,80,140],[120,100,180],[60,80,130],[140,120,200],[90,110,160],[70,90,150],[110,90,170]], breatheColor:'100,100,200', message:'clear mind · one breath at a time' },
  energy:{ bg:'#100608', palette:[[255,100,80],[255,160,60],[255,80,120],[255,200,80],[220,80,200],[255,120,60],[200,60,255],[255,80,80]], breatheColor:'255,120,80', message:'feel the spark · you\'ve got this ⚡' },
};

const PRESETS = {
  solar:{ gravity:.007, repel:55,  sizeScale:1.5, damping:.998, maxSpeed:5,  drift:.022 },
  chaos:{ gravity:.038, repel:210, sizeScale:.65, damping:.958, maxSpeed:18, drift:.03  },
  zen:  { gravity:.013, repel:110, sizeScale:1.0, damping:.985, maxSpeed:4,  drift:.008 },
};

let mood = MOODS.calm;

function setMood(key){
  mood = MOODS[key];
  document.body.style.background = mood.bg;
  msgEl.textContent = mood.message;
  breatheEl.style.borderColor = `rgba(${mood.breatheColor},.13)`;
  balls.forEach(b=>{ b.targetColor = mood.palette[Math.floor(Math.random()*mood.palette.length)]; });
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('active', b.dataset.mood===key));
}

function applyPreset(key){
  Object.assign(P, PRESETS[key]);
  document.getElementById('sl-gravity').value = P.gravity;
  document.getElementById('sl-repel').value   = P.repel;
  document.getElementById('sl-size').value    = P.sizeScale;
  document.getElementById('sl-damp').value    = P.damping;
  document.getElementById('sl-speed').value   = P.maxSpeed;
  updateLabels();
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active', b.dataset.preset===key));
}

// ── Helpers ──
function lerpC(a,b,t){ return [~~(a[0]+(b[0]-a[0])*t),~~(a[1]+(b[1]-a[1])*t),~~(a[2]+(b[2]-a[2])*t)]; }
function toRgba([r,g,b],a=1){ return `rgba(${r},${g},${b},${a})`; }
function lightenRgb(rgb,t){ return rgb.map(c=>~~(c+(255-c)*t)); }

// ── BLACK HOLE state ──
let blackHole = null; // { x, y, strength, life, maxLife }
const BH_DURATION = 2200; // ms

// ── DRAG / SLINGSHOT state ──
let dragBall = null;
let dragOffX = 0, dragOffY = 0;
let dragHistory = []; // last positions for velocity calc

// ── COLLISION RIPPLES pool ──
const collRipples = []; // { x, y, r, maxR, alpha, color }

// ── Mouse state ──
let mx=-9999, my=-9999, smx=-9999, smy=-9999, pressing=false;

document.addEventListener('mousemove', e=>{
  mx = e.clientX; my = e.clientY;
  curEl.style.left = mx+'px'; curEl.style.top = my+'px';

  if(dragBall){
    dragBall.x = mx - dragOffX;
    dragBall.y = my - dragOffY;
    dragBall.vx = 0; dragBall.vy = 0;
    dragHistory.push({ x: dragBall.x, y: dragBall.y, t: Date.now() });
    if(dragHistory.length > 8) dragHistory.shift();
  }
});
document.addEventListener('mouseleave', ()=>{ mx=-9999; my=-9999; });

// left-click: scatter OR start drag
document.addEventListener('mousedown', e=>{
  if(e.button !== 0) return;
  if(e.target.closest('#panel,#toggle-panel')) return;

  // try to grab a ball first
  const picked = balls.find(b=>{
    const dx=b.x-e.clientX, dy=b.y-e.clientY;
    return Math.sqrt(dx*dx+dy*dy) < b.r + 10;
  });

  if(picked){
    dragBall = picked;
    dragOffX = e.clientX - picked.x;
    dragOffY = e.clientY - picked.y;
    dragHistory = [];
    curEl.classList.add('dragging');
  } else {
    pressing = true;
    curEl.classList.add('pressing');
    spawnDomRipple(e.clientX, e.clientY);
    scatter(e.clientX, e.clientY);
  }
});

document.addEventListener('mouseup', e=>{
  if(e.button !== 0) return;
  if(dragBall){
    // slingshot: compute velocity from drag history
    if(dragHistory.length >= 2){
      const old = dragHistory[0];
      const now = dragHistory[dragHistory.length-1];
      const dt  = Math.max(now.t - old.t, 16);
      dragBall.vx = (now.x - old.x) / dt * 16;
      dragBall.vy = (now.y - old.y) / dt * 16;
    }
    dragBall = null;
    curEl.classList.remove('dragging');
  } else {
    pressing = false;
    curEl.classList.remove('pressing');
  }
});

// right-click: black hole
document.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(e.target.closest('#panel,#toggle-panel')) return;
  blackHole = { x: e.clientX, y: e.clientY, strength: 0.6, life: BH_DURATION, maxLife: BH_DURATION };
  curEl.classList.add('blackhole');
  spawnBhRipple(e.clientX, e.clientY);
  msgEl.textContent = '⚫ black hole active';
  setTimeout(()=>{ msgEl.textContent = mood.message; }, 2400);
  setTimeout(()=>{ blackHole=null; curEl.classList.remove('blackhole'); }, BH_DURATION);
});

// touch
document.addEventListener('touchmove', e=>{ e.preventDefault(); mx=e.touches[0].clientX; my=e.touches[0].clientY; if(dragBall){ dragBall.x=mx-dragOffX; dragBall.y=my-dragOffY; dragBall.vx=0; dragBall.vy=0; dragHistory.push({x:dragBall.x,y:dragBall.y,t:Date.now()}); if(dragHistory.length>8)dragHistory.shift(); } },{passive:false});
document.addEventListener('touchstart', e=>{ const t=e.touches[0]; mx=t.clientX; my=t.clientY; const picked=balls.find(b=>{const dx=b.x-mx,dy=b.y-my; return Math.sqrt(dx*dx+dy*dy)<b.r+14;}); if(picked){dragBall=picked;dragOffX=mx-picked.x;dragOffY=my-picked.y;dragHistory=[];}else{scatter(mx,my);spawnDomRipple(mx,my);} });
document.addEventListener('touchend', e=>{ if(dragBall){if(dragHistory.length>=2){const old=dragHistory[0],now=dragHistory[dragHistory.length-1],dt=Math.max(now.t-old.t,16);dragBall.vx=(now.x-old.x)/dt*16;dragBall.vy=(now.y-old.y)/dt*16;}dragBall=null;}mx=-9999;my=-9999; });

function scatter(x,y){
  balls.forEach(b=>{
    const dx=b.x-x, dy=b.y-y, d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d<260){ const f=((260-d)/260)*7/b.mass; b.vx+=(dx/d)*f; b.vy+=(dy/d)*f; }
  });
}

function spawnDomRipple(x,y){
  const el=document.createElement('div'); el.className='ripple';
  el.style.cssText=`left:${x}px;top:${y}px;width:220px;height:220px`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),1300);
}

function spawnBhRipple(x,y){
  const el=document.createElement('div'); el.className='bh-ring';
  el.style.cssText=`left:${x}px;top:${y}px;width:200px;height:200px`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),900);
}

// ── Ball ──
class Ball {
  constructor(){
    const a=Math.random()*Math.PI*2, d=Math.random()*90;
    this.x=gx+Math.cos(a)*d; this.y=gy+Math.sin(a)*d;
    this.vx=(Math.random()-.5)*.8; this.vy=(Math.random()-.5)*.8;
    this.baseR=Math.random()*14+7;
    this.color=[...mood.palette[Math.floor(Math.random()*mood.palette.length)]];
    this.targetColor=[...this.color];
    this.alpha=0; this.targetAlpha=Math.random()*.25+.55;
    this.pulsePhase=Math.random()*Math.PI*2;
    this.driftA=Math.random()*Math.PI*2;
    this.driftS=.002+Math.random()*.003;
    this.prevVx=0; this.prevVy=0; // for collision impact detection
  }
  get r(){ return this.baseR*P.sizeScale; }
  get mass(){ return (this.r/10)**1.5; }

  update(){
    if(this === dragBall) return; // physics paused while dragging

    this.color = lerpC(this.color, this.targetColor, .015);
    this.alpha += (this.targetAlpha - this.alpha) * .04;

    // gravity to center
    const dx=gx-this.x, dy=gy-this.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    this.vx += (dx/d)*(P.gravity/this.mass)*d*.015;
    this.vy += (dy/d)*(P.gravity/this.mass)*d*.015;

    // black hole pull
    if(blackHole){
      const bhx=blackHole.x-this.x, bhy=blackHole.y-this.y;
      const bhd=Math.sqrt(bhx*bhx+bhy*bhy)||1;
      const pull = (blackHole.strength * 180) / (bhd * this.mass);
      this.vx += (bhx/bhd)*pull;
      this.vy += (bhy/bhd)*pull;
    }

    // mouse repulsion
    const REP=pressing?P.repel*1.65:P.repel;
    const dxm=this.x-smx, dym=this.y-smy, dm=Math.sqrt(dxm*dxm+dym*dym)||1;
    if(dm<REP){ const f=((REP-dm)/REP)**2*(pressing?2.1:.9)/this.mass; this.vx+=(dxm/dm)*f; this.vy+=(dym/dm)*f; }

    // drift
    this.driftA+=this.driftS;
    this.vx+=Math.cos(this.driftA)*P.drift; this.vy+=Math.sin(this.driftA)*P.drift;

    // damping + cap
    this.vx*=P.damping; this.vy*=P.damping;
    const spd=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    const cap=(pressing?P.maxSpeed*1.6:P.maxSpeed)/this.mass;
    if(spd>cap){ this.vx=this.vx/spd*cap; this.vy=this.vy/spd*cap; }

    this.prevVx=this.vx; this.prevVy=this.vy;
    this.x+=this.vx; this.y+=this.vy;
    this.pulsePhase+=.018;
  }

  draw(){
    const pr=this.r+Math.sin(this.pulsePhase)*(this.r*.08);
    // dragged ball: bright outline
    const isDragged = (this === dragBall);
    ctx.save(); ctx.globalAlpha = isDragged ? 0.95 : this.alpha;
    // glow
    const glow=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,pr*2.4);
    glow.addColorStop(0,toRgba(this.color, isDragged?.28:.14));
    glow.addColorStop(1,toRgba(this.color,0));
    ctx.beginPath(); ctx.arc(this.x,this.y,pr*2.4,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
    // body
    const grad=ctx.createRadialGradient(this.x-pr*.32,this.y-pr*.32,pr*.05,this.x,this.y,pr);
    grad.addColorStop(0,toRgba(lightenRgb(this.color,.72)));
    grad.addColorStop(.6,toRgba(this.color,.95));
    grad.addColorStop(1,toRgba(this.color,.55));
    ctx.beginPath(); ctx.arc(this.x,this.y,pr,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
    // drag ring
    if(isDragged){
      ctx.strokeStyle='rgba(255,220,80,.8)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(this.x,this.y,pr+4,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Ball pool ──
let balls = Array.from({length:75}, ()=>new Ball());
function setBallCount(n){ if(n>balls.length){ while(balls.length<n) balls.push(new Ball()); } else balls.splice(n); }

// ── Collision with ripple emission ──
function applyCollisions(){
  for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){
    const a=balls[i], b=balls[j];
    if(a===dragBall || b===dragBall) continue;
    const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy)||.001, minD=a.r+b.r+1.5;
    if(d<minD){
      const push=(minD-d)/2, nx=dx/d, ny=dy/d;
      a.x+=nx*push; a.y+=ny*push; b.x-=nx*push; b.y-=ny*push;
      const dvx=a.vx-b.vx, dvy=a.vy-b.vy, dot=dvx*nx+dvy*ny;
      if(dot<0){
        const mt=a.mass+b.mass, imp=(1+.28)*dot/mt;
        a.vx-=imp*b.mass*nx; a.vy-=imp*b.mass*ny;
        b.vx+=imp*a.mass*nx; b.vy+=imp*a.mass*ny;

        // ── COLLISION RIPPLE — only if impact is hard enough ──
        const impact=Math.abs(dot);
        if(impact > 0.8){
          const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
          const maxR = Math.min(60, 15 + impact*8);
          // blend both ball colors
          const blended = lerpC(a.color, b.color, .5);
          collRipples.push({ x:cx, y:cy, r:0, maxR, alpha:Math.min(.7, impact*.18), color:blended });
        }
      }
    }
  }
}

// ── Draw collision ripples ──
function drawCollRipples(){
  for(let i=collRipples.length-1; i>=0; i--){
    const rp=collRipples[i];
    rp.r  += (rp.maxR - rp.r) * 0.12;
    rp.alpha *= 0.88;
    if(rp.alpha < 0.01){ collRipples.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = rp.alpha;
    ctx.strokeStyle = toRgba(rp.color);
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

// ── Draw drag slingshot line ──
function drawDragLine(){
  if(!dragBall) return;
  // line from ball to gravity center showing pull-back direction
  const ax = gx - dragBall.x, ay = gy - dragBall.y;
  const len = Math.sqrt(ax*ax+ay*ay);
  if(len < 5) return;
  ctx.save();
  ctx.globalAlpha = Math.min(.4, len/400);
  ctx.strokeStyle = 'rgba(255,220,80,0.6)';
  ctx.lineWidth   = 1.2;
  ctx.setLineDash([4,6]);
  ctx.beginPath(); ctx.moveTo(dragBall.x, dragBall.y); ctx.lineTo(gx, gy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── Draw black hole ──
function drawBlackHole(){
  if(!blackHole) return;
  const t = blackHole.life / blackHole.maxLife; // 1→0
  blackHole.life -= 16;

  // rotating glow rings
  const time = Date.now() * 0.003;
  for(let ring=0; ring<3; ring++){
    const rr = 18 + ring*14;
    const ra = 0.12 * t * (1-ring*.2);
    ctx.save();
    ctx.globalAlpha = ra;
    ctx.strokeStyle = `rgba(160,60,255,1)`;
    ctx.lineWidth = 1.5 - ring*.4;
    ctx.beginPath();
    ctx.arc(blackHole.x, blackHole.y, rr + Math.sin(time+ring)*4, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // dark core
  ctx.save();
  const cg = ctx.createRadialGradient(blackHole.x, blackHole.y, 0, blackHole.x, blackHole.y, 28);
  cg.addColorStop(0,   `rgba(0,0,0,${0.95*t})`);
  cg.addColorStop(0.5, `rgba(40,0,80,${0.5*t})`);
  cg.addColorStop(1,   `rgba(80,0,140,0)`);
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(blackHole.x,blackHole.y,28,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // accretion streaks
  ctx.save();
  ctx.globalAlpha = 0.15*t;
  ctx.strokeStyle = 'rgba(200,100,255,1)';
  ctx.lineWidth = 1;
  for(let i=0;i<6;i++){
    const a=time*2+i*(Math.PI/3);
    ctx.beginPath();
    ctx.moveTo(blackHole.x+Math.cos(a)*10, blackHole.y+Math.sin(a)*10);
    ctx.lineTo(blackHole.x+Math.cos(a)*50, blackHole.y+Math.sin(a)*50);
    ctx.stroke();
  }
  ctx.restore();
}

// ── Ambient particles ──
const PARTICLES=Array.from({length:38},()=>({
  x:Math.random()*1920, y:Math.random()*1080,
  r:Math.random()*1.4+.3, vy:-(Math.random()*.22+.04),
  vx:(Math.random()-.5)*.1, alpha:Math.random()*.18+.04,
}));
function tickParticles(){ PARTICLES.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.y<-5){p.y=H+5;p.x=Math.random()*W;} if(p.x<0)p.x=W; if(p.x>W)p.x=0; }); }
function drawParticles(){ ctx.save(); ctx.fillStyle=`rgba(${mood.breatheColor},1)`; PARTICLES.forEach(p=>{ ctx.globalAlpha=p.alpha*.5; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }); ctx.restore(); }

// ── Aurora background ──
const AURORA_BLOBS=Array.from({length:6},(_,i)=>({
  x:Math.random(), y:Math.random(),
  vx:(Math.random()-.5)*.00014, vy:(Math.random()-.5)*.00011,
  phase:(Math.PI*2/6)*i, phaseS:.004+Math.random()*.003,
  rx:.28+Math.random()*.22, ry:.18+Math.random()*.18, palIdx:i%8,
}));

let vigGrad=null;
function buildVig(){
  if(!W||!H) return;
  vigGrad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.72);
  vigGrad.addColorStop(0,'rgba(0,0,0,0)');
  vigGrad.addColorStop(.58,'rgba(0,0,0,0)');
  vigGrad.addColorStop(1,'rgba(0,0,0,.58)');
}

let bgPhase=0;
function drawBackground(){
  bgPhase+=.004;
  const hex=mood.bg.replace('#','');
  const br=parseInt(hex.slice(0,2),16), bg_=parseInt(hex.slice(2,4),16), bb=parseInt(hex.slice(4,6),16);
  ctx.fillStyle=`rgb(${br},${bg_},${bb})`; ctx.fillRect(0,0,W,H);

  AURORA_BLOBS.forEach(blob=>{
    blob.x+=blob.vx; blob.y+=blob.vy; blob.phase+=blob.phaseS;
    if(blob.x<-.3)blob.x=1.3; if(blob.x>1.3)blob.x=-.3;
    if(blob.y<-.3)blob.y=1.3; if(blob.y>1.3)blob.y=-.3;
    const col=mood.palette[blob.palIdx%mood.palette.length]||[80,120,200];
    const alpha=.065+Math.sin(blob.phase)*.038;
    ctx.save(); ctx.translate(blob.x*W,blob.y*H); ctx.scale(1,blob.ry/blob.rx);
    const g=ctx.createRadialGradient(0,0,0,0,0,blob.rx*W);
    g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
    g.addColorStop(.5,`rgba(${col[0]},${col[1]},${col[2]},${alpha*.35})`);
    g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,blob.rx*W,0,Math.PI*2); ctx.fill(); ctx.restore();
  });

  if(smx>0&&smx<W&&smy>0&&smy<H){
    const col=mood.palette[0]||[120,180,255];
    const radius=pressing?W*.3:W*.18, intensity=pressing?.13:.07;
    const mg=ctx.createRadialGradient(smx,smy,0,smx,smy,radius);
    mg.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${intensity})`);
    mg.addColorStop(.4,`rgba(${col[0]},${col[1]},${col[2]},${intensity*.28})`);
    mg.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
    ctx.fillStyle=mg; ctx.fillRect(0,0,W,H);
  }

  const cc=mood.palette[2]||[80,160,220];
  const cg=ctx.createRadialGradient(gx,gy,0,gx,gy,W*.2);
  cg.addColorStop(0,`rgba(${cc[0]},${cc[1]},${cc[2]},.09)`);
  cg.addColorStop(.5,`rgba(${cc[0]},${cc[1]},${cc[2]},.025)`);
  cg.addColorStop(1,`rgba(${cc[0]},${cc[1]},${cc[2]},0)`);
  ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.globalAlpha=.016; ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.restore();

  if(vigGrad){ ctx.fillStyle=vigGrad; ctx.fillRect(0,0,W,H); }
}

// ── Slider wiring ──
function updateLabels(){
  document.getElementById('val-gravity').textContent=parseFloat(document.getElementById('sl-gravity').value).toFixed(3);
  document.getElementById('val-repel').textContent=document.getElementById('sl-repel').value;
  document.getElementById('val-size').textContent=parseFloat(document.getElementById('sl-size').value).toFixed(1)+'×';
  document.getElementById('val-damp').textContent=parseFloat(document.getElementById('sl-damp').value).toFixed(3);
  document.getElementById('val-speed').textContent=document.getElementById('sl-speed').value;
  document.getElementById('val-count').textContent=document.getElementById('sl-count').value;
}
function clearPreset(){ document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active')); }
document.getElementById('sl-gravity').addEventListener('input',e=>{ P.gravity=+e.target.value; updateLabels(); clearPreset(); });
document.getElementById('sl-repel').addEventListener('input',e=>{ P.repel=+e.target.value; updateLabels(); clearPreset(); });
document.getElementById('sl-size').addEventListener('input',e=>{ P.sizeScale=+e.target.value; updateLabels(); clearPreset(); });
document.getElementById('sl-damp').addEventListener('input',e=>{ P.damping=+e.target.value; updateLabels(); clearPreset(); });
document.getElementById('sl-speed').addEventListener('input',e=>{ P.maxSpeed=+e.target.value; updateLabels(); clearPreset(); });
document.getElementById('sl-count').addEventListener('input',e=>{ setBallCount(+e.target.value); updateLabels(); });

document.querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));
document.querySelectorAll('.mood-btn').forEach(b=>b.addEventListener('click',()=>setMood(b.dataset.mood)));

// ── Panel toggle ──
const panel=document.getElementById('panel');
const toggleBtn=document.getElementById('toggle-panel');
let panelOpen=true;
toggleBtn.addEventListener('click',()=>{
  panelOpen=!panelOpen;
  panel.classList.toggle('hidden',!panelOpen);
  toggleBtn.classList.toggle('open',panelOpen);
  toggleBtn.textContent=panelOpen?'‹':'›';
});

// ── Loop ──
function loop(){
  smx+=(mx-smx)*.08; smy+=(my-smy)*.08;
  drawBackground();
  tickParticles(); drawParticles();
  applyCollisions();
  drawCollRipples();
  drawBlackHole();
  drawDragLine();
  balls.forEach(b=>{ b.update(); b.draw(); });
  requestAnimationFrame(loop);
}

setMood('calm');
applyPreset('zen');
updateLabels();
loop();
</script>
